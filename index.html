<!DOCTYPE html>
<html>
<head>
    <title>Mobility Calculator</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial;
            color: white;
            overflow: hidden;

            background: radial-gradient(circle at 20% 30%, #5f00ff, transparent 40%),
                        radial-gradient(circle at 80% 70%, #00d4ff, transparent 40%),
                        radial-gradient(circle at center, #0a0a1f, #000);
        }

        /* ✨ floating stars */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: transparent url("https://www.transparenttextures.com/patterns/stardust.png");
            animation: moveStars 60s linear infinite;
            opacity: 0.4;
        }

        @keyframes moveStars {
            from { transform: translate(0, 0); }
            to { transform: translate(-500px, -500px); }
        }

        .box {
            position: relative;
            background: rgba(20, 20, 40, 0.75);
            padding: 30px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(100, 0, 255, 0.6);
            z-index: 1;
        }

        h2 {
            margin-bottom: 20px;
            color: #b388ff;
            text-shadow: 0 0 10px rgba(180, 100, 255, 0.8);
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 16px;
            text-align: center;
            background: #111;
            color: white;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        input:focus {
            box-shadow: 0 0 10px #8a2be2;
        }

        .result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 12px rgba(0,255,200,0.7);
        }

        .formula {
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>⚡ Mobility Calculator</h2>

    <input type="text" id="weight" placeholder="Enter weight (e.g. 625, 1.5M)" oninput="calc()">

    <div class="result" id="result"></div>

    <div class="formula">
        M = (W - 5)<sup>2.222</sup> × 15
    </div>
</div>

<script>
// Parse input like 1.5M → number
function parseNumber(str) {
    if (!str) return NaN;

    str = str.trim().toUpperCase();

    const multipliers = {
        K: 1e3, M: 1e6, B: 1e9, T: 1e12,
        QA: 1e15, QN: 1e18, SX: 1e21, SP: 1e24
    };

    let match = str.match(/^([\d.]+)([A-Z]*)$/);
    if (!match) return NaN;

    let value = parseFloat(match[1]);
    let suffix = match[2];

    return multipliers[suffix] ? value * multipliers[suffix] : value;
}

// Format number → K, M, B...
function formatNumber(num) {
    const units = [
        { value: 1e24, symbol: "Sp" },
        { value: 1e21, symbol: "Sx" },
        { value: 1e18, symbol: "Qn" },
        { value: 1e15, symbol: "Qa" },
        { value: 1e12, symbol: "T" },
        { value: 1e9, symbol: "B" },
        { value: 1e6, symbol: "M" },
        { value: 1e3, symbol: "K" }
    ];

    for (let i of units) {
        if (num >= i.value) {
            return (num / i.value).toFixed(2) + i.symbol;
        }
    }

    return num.toString();
}

// Main calc
function calc() {
    let input = document.getElementById("weight").value;
    let W = parseNumber(input);

    if (!W || W <= 5) {
        document.getElementById("result").innerText = "";
        return;
    }

    let M = Math.floor(Math.pow(W - 5, 2.222) * 15);

    document.getElementById("result").innerText = formatNumber(M);
}
</script>

</body>
</html>
