<!DOCTYPE html>
<html>
<head>
    <title>Mobility Calculator</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial;
            color: white;

            background: url("shinyimage.webp") no-repeat center center;
            background-size: cover;
        }

        .box {
            background: rgba(10, 10, 30, 0.65);
            padding: 25px;
            border-radius: 15px;
            width: 360px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(150, 0, 255, 0.7);
        }

        h2 {
            text-align: center;
            color: #d0aaff;
            text-shadow: 0 0 12px #a64dff, 0 0 25px #6a00ff;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }

        input {
            padding: 8px;
            border-radius: 6px;
            border: none;
            text-align: center;
            background: #111;
            color: white;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 10px #8a2be2;
        }

        .rod {
            margin-top: 10px;
            width: 100%;
        }

        .total {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
            opacity: 0.8;
        }

        .result {
            margin-top: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0,255,200,0.7);
        }
    </style>
</head>

<body>

<div class="box">
    <h2>⚡ Loadout Calculator</h2>

    <div class="grid">
        <input placeholder="Weight 1" oninput="calc()">
        <input placeholder="Weight 2" oninput="calc()">
        <input placeholder="Weight 3" oninput="calc()">
        <input placeholder="Weight 4" oninput="calc()">
        <input placeholder="Weight 5" oninput="calc()">
        <input placeholder="Weight 6" oninput="calc()">
        <input placeholder="Weight 7" oninput="calc()">
        <input placeholder="Weight 8" oninput="calc()">
    </div>

    <input class="rod" placeholder="Rod" oninput="calc()">

    <div class="total" id="total"></div>
    <div class="result" id="result"></div>
</div>

<script>
function parseNumber(str) {
    if (!str) return 0;

    str = str.trim().toUpperCase();

    const mult = {
        K: 1e3, M: 1e6, B: 1e9, T: 1e12,
        QA: 1e15, QN: 1e18, SX: 1e21, SP: 1e24
    };

    let match = str.match(/^([\d.]+)([A-Z]*)$/);
    if (!match) return 0;

    let val = parseFloat(match[1]);
    let suf = match[2];

    return mult[suf] ? val * mult[suf] : val;
}

function format(num) {
    const u = [
        [1e24,"Sp"],[1e21,"Sx"],[1e18,"Qn"],[1e15,"Qa"],
        [1e12,"T"],[1e9,"B"],[1e6,"M"],[1e3,"K"]
    ];

    for (let [v,s] of u) {
        if (num >= v) return (num/v).toFixed(2)+s;
    }
    return Math.floor(num);
}

function calc() {
    let inputs = document.querySelectorAll("input");
    let total = 0;

    inputs.forEach(i => total += parseNumber(i.value));

    document.getElementById("total").innerText =
        total > 0 ? "Total Weight: " + format(total) : "";

    if (total <= 5) {
        document.getElementById("result").innerText = "";
        return;
    }

    let M = Math.floor(Math.pow(total - 5, 2.222) * 15);

    document.getElementById("result").innerText =
        "Mobility: " + format(M);
}
</script>

</body>
</html>
