<!DOCTYPE html>
<html>
<head>
    <title>Mobility Calculator</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial;
            color: white;

            background: url("shinyimage.webp") no-repeat center center;
            background-size: cover;
        }

        .box {
            background: rgba(10, 10, 30, 0.65);
            padding: 30px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(150, 0, 255, 0.7);
        }

        h2 {
            color: #d0aaff;
            text-shadow: 0 0 12px #a64dff, 0 0 25px #6a00ff;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            text-align: center;
            background: #111;
            color: white;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 10px #8a2be2;
        }

        .result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0,255,200,0.7);
        }

        .formula {
            margin-top: 10px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>⚡ Mobility Calculator ⚡</h2>

    <input type="text" id="weight" placeholder="Enter total weight (e.g. 625, 1.5M)" oninput="calc()">

    <div class="result" id="result"></div>

    <div class="formula">
        M = (W - 5)<sup>2.222</sup> × 15
    </div>
</div>

<script>
function parseNumber(str) {
    if (!str) return NaN;

    str = str.trim().toUpperCase();

    const mult = {
        K: 1e3, M: 1e6, B: 1e9, T: 1e12,
        QA: 1e15, QN: 1e18, SX: 1e21, SP: 1e24
    };

    let match = str.match(/^([\d.]+)([A-Z]*)$/);
    if (!match) return NaN;

    let val = parseFloat(match[1]);
    let suf = match[2];

    return mult[suf] ? val * mult[suf] : val;
}

function format(num) {
    const u = [
        [1e24,"Sp"],[1e21,"Sx"],[1e18,"Qn"],[1e15,"Qa"],
        [1e12,"T"],[1e9,"B"],[1e6,"M"],[1e3,"K"]
    ];

    for (let [v,s] of u) {
        if (num >= v) return (num/v).toFixed(2)+s;
    }
    return Math.floor(num);
}

function calc() {
    let input = document.getElementById("weight").value;
    let W = parseNumber(input);

    if (!W || W <= 5) {
        document.getElementById("result").innerText = "";
        return;
    }

    let M = Math.floor(Math.pow(W - 5, 2.222) * 15);

    document.getElementById("result").innerText = format(M);
}
</script>

</body>
</html>
